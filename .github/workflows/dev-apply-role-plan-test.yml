name: Dev Apply Role Plan Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev-apply-role-plan-test
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  CHECKPOINT_DISABLE: "1"
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1

jobs:
  plan-test:
    name: Plan dev infrastructure with apply role
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: github.ref == 'refs/heads/main'

    environment:
      name: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false

      - name: Assume Terraform apply role
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::099107029297:role/taskflow-github-terraform-apply
          role-session-name: taskflow-dev-apply-plan-${{ github.run_id }}
          aws-region: ap-south-1
          allowed-account-ids: "099107029297"

      - name: Verify assumed identity
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT="$(aws sts get-caller-identity             --query Account             --output text)"

          ARN="$(aws sts get-caller-identity             --query Arn             --output text)"

          test "$ACCOUNT" = "099107029297"

          case "$ARN" in
            arn:aws:sts::099107029297:assumed-role/taskflow-github-terraform-apply/*)
              ;;
            *)
              echo "Unexpected assumed identity: $ARN"
              exit 1
              ;;
          esac

          echo "AWS account: $ACCOUNT"
          echo "Assumed identity: $ARN"

      - name: Create backend configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > terraform/environments/dev/backend.tf <<'BACKEND'
          terraform {
            backend "s3" {
              bucket       = "taskflow-terraform-state-4dd9ba6f"
              key          = "three-tier/dev/terraform.tfstate"
              region       = "ap-south-1"
              encrypt      = true
              use_lockfile = true
            }
          }
          BACKEND

      - name: Initialize Terraform
        working-directory: terraform/environments/dev
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false

      - name: Run and verify non-destructive plan
        working-directory: terraform/environments/dev
        shell: bash
        run: |
          set -uo pipefail

          set +e
          terraform plan             -input=false             -no-color             -lock-timeout=5m             -detailed-exitcode             -var-file=dev.ci.tfvars             | tee tfplan.txt

          PLAN_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$PLAN_EXIT" -ne 2 ]; then
            echo "STOP: Expected Terraform exit code 2."
            echo "Actual exit code: $PLAN_EXIT"
            exit 1
          fi

          SUMMARY="$(
            grep -E '^(Plan:|No changes\.)' tfplan.txt               | tail -1
          )"

          EXPECTED_SUMMARY="Plan: 0 to add, 6 to change, 0 to destroy."

          echo "Plan summary: $SUMMARY"

          if [ "$SUMMARY" != "$EXPECTED_SUMMARY" ]; then
            echo "STOP: Unexpected Terraform plan summary."
            exit 1
          fi

          grep -E '^  # .* will be updated in-place$'             tfplan.txt             | sed -E               's/^  # (.*) will be updated in-place$/\1/'             | sort             > actual-resources.txt

          cat > expected-resources.txt <<'RESOURCES'
          module.platform.module.artifacts.aws_s3_object.backend
          module.platform.module.artifacts.aws_s3_object.frontend
          module.platform.module.compute.aws_autoscaling_group.app
          module.platform.module.compute.aws_autoscaling_group.web
          module.platform.module.compute.aws_launch_template.app
          module.platform.module.compute.aws_launch_template.web
          RESOURCES

          sort -o expected-resources.txt expected-resources.txt

          echo
          echo "=== Expected resource changes ==="
          cat expected-resources.txt

          echo
          echo "=== Actual resource changes ==="
          cat actual-resources.txt

          diff -u expected-resources.txt actual-resources.txt

          echo
          echo "PASS: Apply role completed the expected plan."
          echo "PASS: 0 resources will be created."
          echo "PASS: 0 resources will be destroyed."
          echo "No Terraform apply was executed."

      - name: Write test summary
        if: always()
        working-directory: terraform/environments/dev
        shell: bash
        run: |
          {
            echo "## Dev Apply Role Plan Test"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- AWS account: \`099107029297\`"
            echo "- Region: \`ap-south-1\`"
            echo "- Role: \`taskflow-github-terraform-apply\`"
            echo
            grep -E '^(Plan:|No changes\.)'               tfplan.txt 2>/dev/null               | tail -1               || echo "Plan summary unavailable."
            echo
            echo "No Terraform apply was executed."
          } >> "$GITHUB_STEP_SUMMARY"
