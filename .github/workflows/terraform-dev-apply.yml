name: Terraform Dev Apply

run-name: Terraform Dev Apply by ${{ github.actor }} at ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY TASKFLOW DEV
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  CHECKPOINT_DISABLE: "1"
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1

jobs:
  apply:
    name: Apply reviewed dev infrastructure changes
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: dev

    steps:
      - name: Validate manual request
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "STOP: Apply workflow may run only from main."
            exit 1
          fi

          if [ "$CONFIRMATION" != "APPLY TASKFLOW DEV" ]; then
            echo "STOP: Confirmation text does not match."
            exit 1
          fi

          echo "Manual confirmation accepted."
          echo "Branch verified as main."

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false

      - name: Assume Terraform apply role
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::099107029297:role/taskflow-github-terraform-apply
          role-session-name: taskflow-dev-apply-${{ github.run_id }}
          aws-region: ap-south-1
          allowed-account-ids: "099107029297"

      - name: Verify assumed identity
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT="$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )"

          ARN="$(
            aws sts get-caller-identity \
              --query Arn \
              --output text
          )"

          test "$ACCOUNT" = "099107029297"

          case "$ARN" in
            arn:aws:sts::099107029297:assumed-role/taskflow-github-terraform-apply/*)
              ;;
            *)
              echo "STOP: Unexpected assumed identity: $ARN"
              exit 1
              ;;
          esac

          echo "AWS account: $ACCOUNT"
          echo "Assumed identity: $ARN"

      - name: Create backend configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > terraform/environments/dev/backend.tf <<'BACKEND'
          terraform {
            backend "s3" {
              bucket       = "taskflow-terraform-state-4dd9ba6f"
              key          = "three-tier/dev/terraform.tfstate"
              region       = "ap-south-1"
              encrypt      = true
              use_lockfile = true
            }
          }
          BACKEND

      - name: Initialize Terraform
        working-directory: terraform/environments/dev
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false

      - name: Create saved Terraform plan
        working-directory: terraform/environments/dev
        shell: bash
        run: |
          set -uo pipefail

          set +e
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -detailed-exitcode \
            -var-file=dev.ci.tfvars \
            -out=tfplan.bin \
            | tee tfplan.txt

          PLAN_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$PLAN_EXIT" -ne 2 ]; then
            echo "STOP: Expected Terraform plan exit code 2."
            echo "Actual exit code: $PLAN_EXIT"
            exit 1
          fi

          terraform show -json tfplan.bin > tfplan.json

      - name: Validate exact Terraform plan
        working-directory: terraform/environments/dev
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "module.platform.module.compute.aws_autoscaling_group.web",
              "module.platform.module.compute.aws_launch_template.app",
              "module.platform.module.compute.aws_launch_template.web",
          }

          plan = json.loads(
              Path("tfplan.json").read_text(encoding="utf-8")
          )

          if plan.get("errored"):
              raise SystemExit("STOP: Terraform plan is marked errored.")

          if plan.get("complete") is False:
              raise SystemExit("STOP: Terraform plan is incomplete.")

          changed = {}

          for item in plan.get("resource_changes", []):
              address = item.get("address")
              actions = item.get("change", {}).get("actions", [])

              if actions in (["no-op"], ["read"]):
                  continue

              changed[address] = actions

          actual = set(changed)

          print("=== Expected changed resources ===")
          for address in sorted(expected):
              print(address)

          print()
          print("=== Actual changed resources ===")
          for address in sorted(actual):
              print(f"{address}: {changed[address]}")

          missing = expected - actual
          unexpected = actual - expected

          if missing:
              print()
              print("Missing expected resources:")
              for address in sorted(missing):
                  print(address)

          if unexpected:
              print()
              print("Unexpected changed resources:")
              for address in sorted(unexpected):
                  print(f"{address}: {changed[address]}")

          if missing or unexpected:
              raise SystemExit(
                  "STOP: Changed resource set does not match review."
              )

          for address in sorted(expected):
              actions = changed[address]

              if actions != ["update"]:
                  raise SystemExit(
                      f"STOP: {address} has unsafe actions: {actions}"
                  )

          print()
          print("PASS: Exactly three reviewed resources will change.")
          print("PASS: Every resource action is update-only.")
          print("PASS: No create action is present.")
          print("PASS: No delete action is present.")
          print("PASS: No replacement action is present.")
          PY

      - name: Record approved plan
        working-directory: terraform/environments/dev
        shell: bash
        run: |
          set -euo pipefail

          PLAN_SUMMARY="$(
            grep -E '^(Plan:|No changes\.)' tfplan.txt \
              | tail -1
          )"

          EXPECTED="Plan: 0 to add, 3 to change, 0 to destroy."

          echo "Plan summary: $PLAN_SUMMARY"

          if [ "$PLAN_SUMMARY" != "$EXPECTED" ]; then
            echo "STOP: Unexpected plan summary."
            exit 1
          fi

          {
            echo "## Approved Terraform Dev Plan"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- AWS account: \`099107029297\`"
            echo "- Region: \`ap-south-1\`"
            echo "- Role: \`taskflow-github-terraform-apply\`"
            echo
            echo "\`$PLAN_SUMMARY\`"
            echo
            echo "Plan validation passed:"
            echo "- Exact three reviewed resources"
            echo "- Update-only actions"
            echo "- No create, delete, or replacement"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply saved Terraform plan
        working-directory: terraform/environments/dev
        shell: bash
        run: |
          set -o pipefail

          terraform apply \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            tfplan.bin \
            | tee tfapply.txt

          echo
          echo "Terraform saved plan applied successfully."

      - name: Verify no remaining Terraform changes
        working-directory: terraform/environments/dev
        shell: bash
        run: |
          set -uo pipefail

          set +e
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -detailed-exitcode \
            -var-file=dev.ci.tfvars \
            | tee post-apply-plan.txt

          PLAN_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$PLAN_EXIT" -ne 0 ]; then
            echo "STOP: Post-apply plan was not clean."
            echo "Actual exit code: $PLAN_EXIT"
            exit 1
          fi

          grep -q '^No changes\.' post-apply-plan.txt

          {
            echo
            echo "## Post-apply verification"
            echo
            echo "Terraform reports no remaining changes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo
            echo "## Apply workflow failed"
            echo
            echo "Review the failed step before retrying."
            echo "Do not run a manual local Terraform apply."
          } >> "$GITHUB_STEP_SUMMARY"
